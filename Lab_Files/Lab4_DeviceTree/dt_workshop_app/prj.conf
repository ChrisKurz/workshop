# --- Core ---
CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y

# --- Shell, used in the "debugging devicetree at runtime" hands-on
#     section: `device list` shows every DT-derived device, its DT node,
#     and whether it initialized successfully (ready / not ready). ---
CONFIG_SHELL=y
CONFIG_DEVICE_SHELL=y

# Slightly smaller/faster shell boot for the workshop VMs.
CONFIG_SHELL_BACKEND_SERIAL_INTERRUPT_DRIVEN=y
