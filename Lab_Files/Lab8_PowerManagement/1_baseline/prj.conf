# Lab 1 - Baseline ("unoptimized") application
#
# Deliberately leaves system and device power management DISABLED so this
# build serves as the reference point for every later lab's measurements.

# --- Power management: intentionally OFF for this lab ---
# CONFIG_PM=n         (default) => not used at all on nRF54L15 => HW feature!!!
# CONFIG_PM_DEVICE=n  (default)

# --- GPIO for the LED ---
CONFIG_GPIO=y

# --- Console / logging: default UART, exactly as a "typical" app would ship ---
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y
