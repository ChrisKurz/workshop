# Lab 3 - Device Power Management (Runtime PM)
#
# This build demonstrates Device Runtime PM on a secondary UART instance
# (see boards/nrf54l15dk_nrf54l15_cpuapp.overlay). There is no CONFIG_PM
# here - it cannot be selected on this SoC (see workshop Module 1.4/2.1).
#
# Zephyr also offers System-Managed Device PM (CONFIG_PM_DEVICE_SYSTEM_MANAGED)
# as an alternative to Runtime PM on SoCs that have real system PM. It is
# intentionally NOT used here: its trigger is the CPU-level sleep transition
# that CONFIG_PM's idle thread would drive, and that transition does not
# exist on this SoC - so system-managed device PM would have nothing to
# hook into. Device Runtime PM has no such dependency, which is exactly
# why it is the only device-PM model this workshop uses on this board.

CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# --- GPIO for the LED and the PPK2 marker pin ---
CONFIG_GPIO=y

# --- The peripheral we runtime-PM: a secondary UART instance ---
CONFIG_SERIAL=y

# --- Disable Logging  ---
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
