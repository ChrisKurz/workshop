# --- Base application config ---
CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y

# --- TrustZone / TF-M ---
# Building for the .../cpuapp/ns board target automatically pulls in TF-M
# as the Secure Processing Environment (SPE) image via sysbuild.
# The application image below is the Non-Secure Processing Environment
# (NSPE) image: everything in this file only affects the NS app image.

# Do NOT use the minimal TF-M profile for this exercise: the minimal
# profile only exposes the Crypto and Platform secure services (this is
# what the previous "PSA random number" exercise could rely on). The
# Protected Storage service used below requires the default (non-minimal)
# TF-M profile.
# CONFIG_TFM_PROFILE_TYPE_MINIMAL=n   (default, left unset on purpose)
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y

# Explicitly enable the PSA Protected Storage secure partition inside TF-M.
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=y

# --- Convenience for the demo ---
CONFIG_ASSERT=y
