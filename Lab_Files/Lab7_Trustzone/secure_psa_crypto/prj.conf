# ---------------------------------------------------------------------------
# TrustZone / Trusted Firmware-M (TF-M)
# ---------------------------------------------------------------------------
# CONFIG_BUILD_WITH_TFM tells the build system to compile this application
# as the NON-SECURE image and to build + merge Trusted Firmware-M as the
# SECURE image alongside it. It only has an effect when you build for a
# "/ns" board target, e.g. nrf54l15dk/nrf54l15/cpuapp/ns.
#
# For */ns targets the nRF Connect SDK build system normally enables this
# automatically, but it is set explicitly here so the dependency is visible
# and documented.
CONFIG_BUILD_WITH_TFM=y

# TF-M profile: MINIMAL (default) keeps the Secure image small — the right
# choice for the nRF54L15's 0.5 MB flash / 96 KB RAM budget, and what this
# project uses. To try the Full profile instead (more PSA services, larger
# footprint), set this to n — see README.md, "Alternative options".
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# ---------------------------------------------------------------------------
# PSA Crypto — used by the "call a Secure service" demo in src/main.c
# ---------------------------------------------------------------------------
# This makes psa_generate_random() available. The actual random-number
# generation executes inside TF-M / the CRACEN hardware accelerator, in the
# Secure world — the Non-secure application code never touches key material
# or the RNG peripheral directly.
CONFIG_PSA_WANT_GENERATE_RANDOM=y

# ---------------------------------------------------------------------------
# Logging / console
# ---------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y
